# Local development services.
#   docker compose up -d                 → PostgreSQL (+ test databases) and Mailpit
#   docker compose --profile s3 up -d    → also MinIO (S3-compatible storage)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_lab
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches all outgoing email: UI at http://localhost:8025, SMTP on localhost:1025
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ['s3']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
